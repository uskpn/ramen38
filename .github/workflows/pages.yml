# RAMEN 38 を GitHub Pages に公開する
name: Deploy RAMEN 38 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'google*.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'data/shops.json'
      - 'scripts/build-pages.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 公開に必要なファイルだけを _site にまとめる（スクリプトや作業用CSVは含めない）
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html robots.txt sitemap.xml _site/
          cp google*.html _site/
          # 更新したCSS/JSがすぐ反映されるよう、コミットごとのバージョンを付ける（ブラウザの古いキャッシュ対策）
          sed -i "s/__VERSION__/${GITHUB_SHA::7}/g" _site/index.html
          cp -r css js assets _site/
          cp data/shops.json _site/data/
          # 店ごとの静的ページ・全店舗一覧・sitemap.xml を作る（検索で一店ずつ見つけてもらうため）
          node scripts/build-pages.mjs _site "${GITHUB_SHA::7}"
          touch _site/.nojekyll
          find _site -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
